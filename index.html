    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SciNexa",
      "alternateName": ["ساينكسا", "SciNexa Platform"],

      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All (Web, Windows, Android, iOS, macOS, Linux)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "educationalUse": "Virtual Science Laboratory & Interactive 3D Simulations",
      "audience": {
        "@type": "EducationalAudience",
        "educationalRole": "student"
      }

    <!-- Official Fish Audio Agent Embed for Darwin -->
    <script src="https://unpkg.com/@fishaudio/agent-widget-embed@0.3.0/dist/index.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Darwin Fish Audio Agent — greeting set dynamically from student profile -->
    <fish-agent
      id="fish-agent-darwin"
      agent-id="929a1bf391db4185b03ae62f05a49207"
      language="ar"
      agent-name="داروين • مرشد العلوم"
      greeting="أهلاً يا بطل! أنا داروين مرشدك العلمي في منصة SciNexa."
      text-input="true"
      transcript="true"
      mic-muting="true"
    ></fish-agent>
    <script>
      (function() {
        try {
          // Read student name from localStorage
          var fullName = '';
          var gradeCode = 'sec2';

          // Try scinexa_user_fullname first
          try { fullName = localStorage.getItem('scinexa_user_fullname') || ''; } catch(e) {}

          // Try scinexa_student_profile JSON
          if (!fullName) {
            try {
              var prof = JSON.parse(localStorage.getItem('scinexa_student_profile') || 'null');
              if (prof && prof.quadName) fullName = prof.quadName;
            } catch(e) {}
          }

          // Try cookies as fallback
          if (!fullName) {
            try {
              var cookies = document.cookie.split(';');
              for (var i = 0; i < cookies.length; i++) {
                var c = cookies[i].trim();
                if (c.startsWith('scinexa_user_fullname=')) {
                  fullName = decodeURIComponent(c.split('=')[1]);
                  break;
                }
              }
            } catch(e) {}
          }

          // Read grade code
          try { gradeCode = localStorage.getItem('scinexa_grade') || 'sec2'; } catch(e) {}

          // Extract first name — handles Arabic compound names like عبد الرحمن
          function extractFirstName(name) {
            if (!name) return '';
            var parts = name.trim().split(/\s+/);
            if (parts.length === 0) return '';
            var prefixes = ['عبد','أبو','ابو','أم','ام','ابن','سيف','نور','علاء','ضياء','شمس','بهاء','تقي','تقى','حسام','صلاح','عماد','جمال','كمال','جلال'];
            if (parts.length >= 2 && prefixes.indexOf(parts[0]) !== -1) {
              return parts[0] + ' ' + parts[1];
            }
            return parts[0];
          }

          // Map grade code to Arabic label
          var gradeMap = {
            'sec1':  'الصف الأول الثانوي',
            'sec2':  'الصف الثاني الثانوي',
            'sec3':  'الصف الثالث الثانوي',
            'prep1': 'الصف الأول الإعدادي',
            'prep2': 'الصف الثاني الإعدادي',
            'prep3': 'الصف الثالث الإعدادي'
          };

          var firstName = fullName ? extractFirstName(fullName) : '';
          var gradeAr   = gradeMap[gradeCode] || 'الصف الثاني الثانوي';

          var agent = document.getElementById('fish-agent-darwin');
          if (agent && firstName) {
            var greeting = 'أهلاً يا ' + firstName + ' يا بطل ' + gradeAr + '! أنا داروين مرشدك العلمي في منصة SciNexa، جاهز لاستكشاف أي تجربة أو فحص أي جزء معايك اليوم!';
            agent.setAttribute('greeting', greeting);

            // Rich dynamic-variables so Fish Audio system-prompt {{variables}} resolve correctly
            var vars = {
              student_first_name:  firstName,
              student_name:        firstName,
              student_full_name:   fullName || firstName,
              student_grade:       gradeAr,
              greeting_phrase:     greeting,
              current_lab:         'dashboard',
              selected_part_ar:    '',
              selected_part_en:    '',
              lab_instructions:    'اسم الطالب الأول هو (' + firstName + '). ناديه دائماً بـ (' + firstName + ') فقط. إذا سألك (اسمي ايه) أجب فوراً: اسمك يا بطل هو ' + firstName + ' وأنت بطل ' + gradeAr + '!'
            };
            agent.setAttribute('dynamic-variables', JSON.stringify(vars));
          }
        } catch(err) {
          // silent fail — fish-agent will use default greeting
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
